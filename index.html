<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZ-104 2026 Master Cram Book</title>
<style>
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1220;color:#e5eefc}
  main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  .card{max-width:620px;padding:28px;border:1px solid #263552;border-radius:20px;background:#111b2e;box-shadow:0 20px 60px #0006}
  .bar{height:8px;background:#23314d;border-radius:99px;overflow:hidden;margin-top:18px}.bar>i{display:block;height:100%;width:35%;background:#63a4ff;border-radius:99px;animation:move 1s ease-in-out infinite alternate}
  small{color:#aab8d0}@keyframes move{to{transform:translateX(180%)}}
</style>
</head>
<body>
<main><div class="card"><h1>AZ-104 Master Cram Book</h1><p>กำลังโหลดคู่มือ Interactive…</p><div class="bar"><i></i></div><p><small id="status">Loading study payload</small></p></div></main>
<script>
(async()=>{
  try{
    const names=[
      'payload/part00-v2.txt',
      'payload/part01-v2.txt',
      'payload/part02-v2.txt',
      'payload/part03a-v2.txt',
      'payload/part03b-v2.txt',
      'payload/part04a-v2.txt',
      'payload/part04b-v2.txt',
      'payload/part05a-v2.txt',
      'payload/part05b-v2.txt',
      'payload/part06a-v2.txt',
      'payload/part06b-v2.txt'
    ];
    const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(`${n}: ${r.status}`);return (await r.text()).trim()}));
    const b64=parts.join('');
    const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('Browser does not support DecompressionStream. Please use current Chrome, Edge, Firefox, or Safari.');
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    document.open(); document.write(html); document.close();
  }catch(e){document.getElementById('status').textContent='โหลดไม่สำเร็จ: '+e.message; console.error(e)}
})();
</script>
</body>
</html>
